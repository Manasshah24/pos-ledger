upstream ledger {
    server api1:8080 max_fails=1 fail_timeout=5s;
    server api2:8080 max_fails=1 fail_timeout=5s;
}

server {
    listen 80;
    client_max_body_size 20m;

    location / {
        proxy_pass http://ledger;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        # A replica that dies mid-request: send the request to the other one. Safe because every write is idempotent,
        # so nginx may replay POSTs too (non_idempotent).
        proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
        proxy_next_upstream_tries 2;
        # A killed container is unreachable rather than refusing connections; give up on it quickly and use the other replica.
        proxy_connect_timeout 2s;
        proxy_read_timeout 60s;
    }
}
