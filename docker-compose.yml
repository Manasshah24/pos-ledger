# docker compose up --build
# Postgres, two API replicas and an nginx in front. Open http://localhost:8080 for the dashboard.
x-api: &api
  build: .
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  environment:
    # Pool of 40 per replica so two replicas stay well inside Postgres's max_connections.
    ConnectionStrings__Ledger: "Host=postgres;Port=5432;Username=ledger;Password=ledger;Database=ledger;Maximum Pool Size=40"
    # Close each store's business day automatically at 02:00 local time (checked every 60 s on every replica).
    # Set to 0 to close days only through POST /admin/stores/{id}/close, e.g. when replaying old simulated timestamps.
    Ledger__AutoCloseIntervalSeconds: "60"
    # Largest unsecured overspend allowed per gift card for offline redemptions, in minor units. 0 = strict.
    Ledger__OfflineUnsecuredLimitMinor: "0"
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
    interval: 5s
    timeout: 3s
    retries: 20
    start_period: 10s

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 3s
      timeout: 3s
      retries: 20

  api1:
    <<: *api

  api2:
    <<: *api

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy

volumes:
  pgdata:
